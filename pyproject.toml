# Pytest jobs, and the audit pages' renderer (the pages group). Parent runtime tools stay on the
# standard library and keep their own floors. This file does not change those contracts.

[project]
name = "myon-bioinformatics"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8",
  "PyYAML>=6",
  "coverage>=7",
  "pip>=23",
  { include-group = "pages" },
]
# 📌 PSWB (PySaiyanWeBoo) renders the audit pages (ci_status.py, scripts/build_audit_pages.py). The pin is the same
# commit as PSWB in .github/workflows/reusable-pages-static.yml (tests/test_workflows.py); move both, then uv lock.
pages = [
  "pysaiyanweboo @ git+https://github.com/myon-bioinformatics/PySaiyanWeBoo@2518d660c199d41424cef9fad451d696fdef4f8e",
]
