<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>形式変換・検証</title><link rel="stylesheet" href="style.css"></head><body><div class="format-lab">
<header><strong><i>↔</i> Format Lab</strong><span> /　検証ワークベンチ</span><small id="saved">●　ローカル保存</small></header>
<div class="layout"><aside><div class="eyebrow">WORKSPACE</div><h2>ドキュメント</h2><button id="add" class="primary">＋　文書を追加</button><nav id="docs"></nav><div class="io"><small>ワークスペースデータ</small><button id="exp">↓　JSONを書き出す</button><button id="imp">↑　JSONを読み込む</button><!-- FORMAT_LAB_DOWNLOAD --><input hidden type="file" id="json" accept=".json"></div></aside>
<main><section class="heading"><div><small>検証ワークベンチ　 /　 ドキュメント</small><h1 id="title"></h1></div><select id="state" aria-label="進行状態"></select></section>
<section class="pipeline"><div class="sectiontitle"><h2>変換パイプライン</h2><b class="badge" id="match"></b></div><div class="stages" id="stages"></div></section>
<div class="tabs" role="navigation"><button data-tab="editor">変換ビュー</button><button data-tab="links">参照・リンク <span id="count"></span></button><button data-tab="evidence">検証記録</button></div>
<div id="editor"><section class="panel diagnosis"><label>入力形式 <select id="format"></select></label><button id="inspect">原本を静的検査</button> <a download href="inspect_format.py">Python・TOML用CLI</a><pre id="report" aria-live="polite"></pre></section><div class="split"><section class="panel"><div class="bar"><b><em>Ｍ↓</em> 入力原本</b><small>編集可能</small></div><textarea spellcheck="false" id="src" aria-label="入力原本"></textarea><footer id="stats"></footer></section><section class="panel"><div class="bar"><b><em>〈/〉</em> HTML 生成結果</b><select id="mode" aria-label="HTML表示形式"><option>プレビュー</option><option>ソース</option></select></div><div id="preview"></div><pre hidden id="code"></pre><footer><button id="artifact">↓　HTMLを保存</button></footer></section></div>
<details><summary>Base64・復元結果・差分</summary><label>Base64（編集して比較）<textarea id="b64"></textarea></label><label>復元した原本<pre id="decoded"></pre></label><label>原本との行差分<pre id="diff"></pre></label><button id="reset">原本から再生成</button><label>保存したHTMLから原本を復元<input type="file" id="fromhtml" accept=".html"></label></details></div>
<section class="panel form" id="links" hidden><h2>参照ファイルとリンク検査</h2><p>抽出した参照ごとに、実際に確認した結果と根拠を記録します。</p><div id="refs"></div></section><section class="panel form" id="evidence" hidden><h2>検証記録</h2><p>JSON書き出し後の再検証　<code>python verify.py markdown-workspace.json</code>　<a download href="verify.py">検証CLI</a></p><div id="fields"></div></section><div role="status" id="notice"></div></main></div>
<dialog id="newdoc"><form method="dialog"><h2>文書を追加</h2><label>ファイル名<input id="name" value="untitled.md" required></label><label>UTF-8ファイルから読み込む<input id="file" type="file" ></label><div><button value="cancel" formnovalidate>キャンセル</button> <button class="primary" value="ok">追加する</button></div></form></dialog></div><script src="formats.js"></script><script src="app.js"></script></body></html>
