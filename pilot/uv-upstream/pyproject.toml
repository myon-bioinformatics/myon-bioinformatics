# Parent consumer for one already packaged upstream project.
# CI runs `uv lock --upgrade` and records the resolved commit.
# The generated lock is not committed.

[project]
name = "uv-upstream-pilot"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["browser-test-kit-tools"]

[tool.uv]
package = false

[tool.uv.sources]
browser-test-kit-tools = { git = "https://github.com/myon-bioinformatics/browser-test-kit", branch = "main" }
