<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Repository Observatory | 親子リポジトリ監査</title>
  <link rel="stylesheet" href="pswb-shell.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip-link" href="#content">監査一覧へ移動</a>
<aside>
  <div class="brand">◈ <span>OBSERVATORY</span></div>
  <div class="owner">myon-bioinformatics<br><small>REPOSITORY OPERATIONS</small></div>
  <nav aria-label="サイドナビゲーション">
    <button data-view="all" class="active">▤　監査ワークスペース</button>
    <button data-view="focus">◎　優先対応</button>
    <button data-view="dependencies">⇄　依存・統合順序・固定SHA</button>
    <button data-view="progress">▦　共通化の進捗</button>
    <button data-view="history">◷　週次スナップショット</button>
    <button data-view="done">✓　完了記録</button>
  </nav>
  <div class="aside-bottom"><span class="dot"></span> 静的 / GitHub Pages 対応<p>Python 3.11+ · 追加依存なし</p><a href="pages-source.zip">↓ Pages連携ソース</a></div>
</aside>
<main>
  <header class="workspace-header">
    <div class="header-meta"><span>WORKSPACE / WEEKLY AUDIT</span><a href="https://github.com/myon-bioinformatics/myon-bioinformatics" target="_blank" rel="noopener">親リポジトリ ↗</a></div>
    <nav class="horizontal-row ui-shell-scroll" data-scroll-label="上部ナビゲーション" aria-label="上部ナビゲーション">
      <button data-view="all" class="active">▤ 監査一覧</button><button data-view="focus">◎ 優先対応</button><button data-view="dependencies">⇄ 依存・統合順序・固定SHA</button><button data-view="progress">▦ 共通化の進捗</button><button data-view="history">◷ 週次記録</button><button data-view="done">✓ 完了記録</button>
    </nav>
  </header>
  <section class="heading">
    <div><div class="eyebrow">監査</div><h1>親子リポジトリ監査<span> /</span></h1><p>PR・Issue・CI・依存関係を確認します。</p></div>
    <div class="actions horizontal-row ui-shell-scroll" data-scroll-label="監査の操作"><a href="evidence.html">◉ GitHub検証証跡 ↗</a><a href="component-ops/">利用導線・責務移管 ↗</a><button id="refresh">↻ 観測値を再読込</button><button id="import">↑ JSON読込</button><button id="export">↓ 記録を書出し</button><button class="primary" id="snapshot">＋ 週次記録</button></div>
  </section>
  <div id="notice" role="status">データを読み込み中…</div>
  <section id="stats" class="stats"></section>
  <div class="tabs"><button id="listTab" class="active">監査一覧</button><button id="compare">選択項目を比較 <span id="count">0</span></button><span id="scope">全リポジトリ</span></div>
  <section id="filters"><input id="search" placeholder="⌕ リポジトリ、番号、課題を検索" aria-label="検索"><select id="repo" aria-label="リポジトリ"><option value="">全リポジトリ</option></select><select id="ci" aria-label="CI"><option value="">すべてのCI</option><option>失敗</option><option>成功</option><option>実行中</option><option>不明</option><option>不完全</option><option>チェックなし</option><option>対象外</option></select><select id="state" aria-label="作業状態"><option value="">すべての状態</option><option>調査中</option><option>着手中</option><option>完了</option><option>保留</option><option>ブロッカー</option></select><select id="axis" aria-label="監査軸"><option value="">すべての監査軸</option></select><select id="sort" aria-label="並び順"><option value="priority">優先度順</option><option value="repo">リポジトリ順</option></select></section>
  <section id="integration-summary" aria-label="統合後の確認"></section>
  <section id="content" tabindex="-1" aria-label="監査結果"></section>
  <footer>
    <nav class="horizontal-row ui-shell-scroll" data-scroll-label="フッターナビゲーション" aria-label="フッターナビゲーション">
      <button data-view="all" class="active">▤ 監査一覧</button><button data-view="focus">◎ 優先対応</button><button data-view="dependencies">⇄ 依存・統合順序・固定SHA</button><button data-view="progress">▦ 共通化の進捗</button><button data-view="history">◷ 週次記録</button><button data-view="done">✓ 完了記録</button>
    </nav>
    <div class="footer-meta">OBSERVATORY <span>作業記録はこのブラウザに保存されます。端末間の引き継ぎにはJSON書出しを使用。</span></div>
  </footer>
</main>
<dialog id="detail"><div id="detailBody"></div><button id="close">閉じる</button></dialog>
<input type="file" id="file" accept="application/json,.json" hidden>
<script src="audit-model.js"></script><script src="scroll-controls.js"></script><script src="app.js"></script><script src="integration.js"></script>
</body>
</html>
