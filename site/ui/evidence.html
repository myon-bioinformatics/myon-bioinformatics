<main><header><span>WORKSPACE <span class="slash">/</span> EVIDENCE</span><div><span class="readonly">● READ ONLY</span><a href="index.html">監査を開く ↗</a></div></header>
<section class="heading"><div><div class="eyebrow">GITHUB / VERIFICATION</div><h1>GitHub検証証跡<span> /</span></h1><p>対象SHA・実行結果・不足証跡を確認。</p></div><div class="actions"><button id="load">↑ JSON読込</button><button id="export">↓ 書出し</button><button id="snapshot" class="primary">完了・週次記録</button></div></section>
<div class="notice"><span></span><div id="coverage">読込中…</div></div><section id="stats" class="stats"></section>
<nav id="tabs" class="tabs"><button data-tab="list" class="active">証跡一覧</button><button data-tab="timeline">時系列</button><button data-tab="compare">比較 <span id="selectedCount">0</span></button><button data-tab="plan">確認順序</button><button data-tab="counts">集計・前回差分</button><a href="records.html">完了・週次記録</a></nav>
<section class="filters"><input id="search" placeholder="⌕ リポジトリ・番号・SHA・証跡を検索" aria-label="検索"><select id="repo" aria-label="リポジトリ"><option value="">全リポジトリ</option></select><select id="filter" aria-label="証跡の条件"><option value="">すべての証跡</option><option value="gap">証跡不足</option><option value="fail">CI失敗</option><option value="success">CI成功（一部観測）</option><option value="manual">手動報告</option><option value="mismatch">期待SHA不一致</option><option value="bot">bot失敗</option><option value="open">未クローズPR</option><option value="draft">Draft</option><option value="unmerged">未マージ</option><option value="approval">承認証跡なし</option><option value="bug">残存バグ</option><option value="review">未解決レビュー</option><option value="conflict">mergeable=false</option><option value="old">旧SHAのCI</option></select><select id="kind" aria-label="証跡種別"><option value="">全種別</option><option>status_sync</option><option>ci</option><option>job</option><option>comment</option><option>review</option><option>manual_report</option><option>supersession_claim</option><option>closure</option><option>merge</option><option>pre_merge</option><option>post_merge</option></select><select id="state" aria-label="作業状態"><option value="">全状態</option><option>調査中</option><option>着手中</option><option>完了</option><option>保留</option><option>ブロッカー</option></select></section>
<div class="work"><section id="content"></section><section id="detail" aria-label="証跡詳細"></section></div><footer><span id="count"></span><span>JST表示 · 成功はマージ可否を保証しません · <a href="index.html">依存・統合順序は監査で確認 ↗</a></span></footer><div id="toast" role="status"></div></main><input type="file" id="file" accept="application/json,.json" hidden><script src="evidence-model.js"></script><script src="evidence.js"></script></body></html>
