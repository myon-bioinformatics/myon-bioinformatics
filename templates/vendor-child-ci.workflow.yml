# Copied verbatim into each child as .github/workflows/vendor-child-ci.yml
# (parent CI verifies byte-for-byte equality with this template).

name: Vendor child CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Resolve parent pull request and verify child checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PARENT_REF_PATH: templates/parent-pr.ref.json
          CHILD_CONSUMER: ${{ github.repository }}
          PARENT_REPOSITORY: myon-bioinformatics/myon-bioinformatics
        run: |
          set -euo pipefail
          export GH_TOKEN="$GITHUB_TOKEN"
          python -I -S <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path

          PARENT = os.environ["PARENT_REPOSITORY"]
          ref_path = Path(os.environ["PARENT_REF_PATH"])
          consumer = os.environ["CHILD_CONSUMER"].strip().lower()
          token = os.environ.get("GH_TOKEN") or ""

          def api(url):
              headers = {"Accept": "application/vnd.github+json", "User-Agent": "vendor-child-ci/bootstrap"}
              if token:
                  headers["Authorization"] = "Bearer " + token
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as resp:
                  return json.loads(resp.read().decode("utf-8"))

          ref = json.loads(ref_path.read_text(encoding="utf-8"))
          if ref.get("schema") != "parent-pr-ref/1":
              raise SystemExit("expected parent-pr-ref/1")
          if ref.get("repository", "").lower() != PARENT.lower():
              raise SystemExit("parent-pr.ref.json repository mismatch")
          pull_number = ref.get("pull_number")
          repo_id = ref.get("repository_id")
          if type(pull_number) is not int or pull_number < 1:
              raise SystemExit("invalid pull_number in parent-pr.ref.json")
          if type(repo_id) is not int or repo_id < 1:
              raise SystemExit("invalid repository_id in parent-pr.ref.json")

          expected_sha = ref.get("commit")
          if not isinstance(expected_sha, str) or not re.fullmatch(r"[0-9a-f]{40}", expected_sha):
              raise SystemExit("explicit parent commit SHA required")

          pull = api("https://api.github.com/repos/" + PARENT + "/pulls/" + str(pull_number))
          parent_meta = api("https://api.github.com/repos/" + PARENT)
          if (type(parent_meta.get("id")) is not int or parent_meta["id"] != repo_id or
                  parent_meta.get("full_name", "").lower() != PARENT.lower()):
              raise SystemExit("repository id/name mismatch for parent")
          if type(pull.get("number")) is not int or pull["number"] != pull_number:
              raise SystemExit("pull number mismatch")
          base_repo = (pull.get("base") or {}).get("repo") or {}
          if (type(base_repo.get("id")) is not int or base_repo["id"] != repo_id or
                  base_repo.get("full_name", "").lower() != PARENT.lower()):
              raise SystemExit("pull base repository mismatch")
          if pull.get("merged_at"):
              commit = pull.get("merge_commit_sha")
          else:
              if pull.get("state") != "open":
                  raise SystemExit("parent pull request is closed without merge")
              head_repo = (pull.get("head") or {}).get("repo") or {}
              if (type(head_repo.get("id")) is not int or head_repo["id"] != repo_id or
                      head_repo.get("full_name", "").lower() != PARENT.lower()):
                  raise SystemExit("unmerged parent pull request must belong to parent repository")
              commit = (pull.get("head") or {}).get("sha")
          if not commit or not re.fullmatch(r"[0-9a-f]{40}", commit):
              raise SystemExit("could not resolve parent pull request commit")

          if commit != expected_sha:
              raise SystemExit("parent SHA mismatch")

          work = Path("parent-at-pin")
          if work.exists():
              raise SystemExit("unexpected parent-at-pin")
          subprocess.run(
              ["git", "init", "-q", str(work)],
              check=True,
          )
          subprocess.run(
              ["git", "-C", str(work), "remote", "add", "origin", "https://github.com/" + PARENT + ".git"],
              check=True,
          )
          subprocess.run(
              ["git", "-C", str(work), "fetch", "--depth", "1", "origin", commit],
              check=True,
          )
          subprocess.run(
              ["git", "-C", str(work), "checkout", "-q", "FETCH_HEAD"],
              check=True,
          )
          actual = subprocess.run(
              ["git", "-C", str(work), "rev-parse", "HEAD"],
              check=True, capture_output=True, text=True,
          ).stdout.strip()
          if actual != expected_sha:
              raise SystemExit("fetched parent SHA mismatch")
          cmd = [
              sys.executable,
              "-E",
              "-S",
              str(work / "vendor_sync.py"),
              "run-child-ci",
              "--root",
              ".",
              "--ref-file",
              str(ref_path),
              "--consumer-name",
              consumer,
              "--parent",
              PARENT,
          ]
          proc = subprocess.run(cmd)
          raise SystemExit(proc.returncode)
          PY
