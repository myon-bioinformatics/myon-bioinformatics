# Copied verbatim into each child as .github/workflows/vendor-child-ci.yml
# (parent CI verifies byte-for-byte equality with this template).

name: Vendor child CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Resolve parent pull request and verify child checkout
        env:
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PARENT_REF_PATH: templates/parent-pr.ref.json
          CHILD_CONSUMER: ${{ github.repository }}
          PARENT_REPOSITORY: myon-bioinformatics/myon-bioinformatics
        run: |
          set -euo pipefail
          export GH_TOKEN="${GH_READ_TOKEN:-$GITHUB_TOKEN}"
          python -S <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path

          PARENT = os.environ["PARENT_REPOSITORY"]
          ref_path = Path(os.environ["PARENT_REF_PATH"])
          consumer = os.environ["CHILD_CONSUMER"].strip().lower()
          token = os.environ.get("GH_TOKEN") or ""

          def api(url):
              headers = {"Accept": "application/vnd.github+json", "User-Agent": "vendor-child-ci/bootstrap"}
              if token:
                  headers["Authorization"] = "Bearer " + token
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as resp:
                  return json.loads(resp.read().decode("utf-8"))

          ref = json.loads(ref_path.read_text(encoding="utf-8"))
          if ref.get("schema") != "parent-pr-ref/1":
              raise SystemExit("expected parent-pr-ref/1")
          if ref.get("repository", "").lower() != PARENT.lower():
              raise SystemExit("parent-pr.ref.json repository mismatch")
          pull_number = ref.get("pull_number")
          repo_id = ref.get("repository_id")
          if not isinstance(pull_number, int) or pull_number < 1:
              raise SystemExit("invalid pull_number in parent-pr.ref.json")
          if not isinstance(repo_id, int) or repo_id < 1:
              raise SystemExit("invalid repository_id in parent-pr.ref.json")

          pull = api("https://api.github.com/repos/" + PARENT + "/pulls/" + str(pull_number))
          parent_meta = api("https://api.github.com/repos/" + PARENT)
          if int(parent_meta["id"]) != int(repo_id):
              raise SystemExit("repository id mismatch for parent")
          if pull.get("merged_at"):
              commit = pull.get("merge_commit_sha")
          else:
              commit = (pull.get("head") or {}).get("sha")
          if not commit or not re.fullmatch(r"[0-9a-f]{40}", commit):
              raise SystemExit("could not resolve parent pull request commit")

          work = Path("parent-at-pin")
          if work.exists():
              raise SystemExit("unexpected parent-at-pin")
          subprocess.run(
              ["git", "init", "-q", str(work)],
              check=True,
          )
          subprocess.run(
              ["git", "-C", str(work), "remote", "add", "origin", "https://github.com/" + PARENT + ".git"],
              check=True,
          )
          subprocess.run(
              ["git", "-C", str(work), "fetch", "--depth", "1", "origin", commit],
              check=True,
          )
          subprocess.run(
              ["git", "-C", str(work), "checkout", "-q", "FETCH_HEAD"],
              check=True,
          )
          cmd = [
              sys.executable,
              "-S",
              str(work / "vendor_sync.py"),
              "run-child-ci",
              "--root",
              ".",
              "--ref-file",
              str(ref_path),
              "--consumer",
              consumer,
              "--parent",
              PARENT,
          ]
          proc = subprocess.run(cmd)
          raise SystemExit(proc.returncode)
          PY
