name: py_launch tests

on:
  pull_request:
    paths:
      - "py_launch.cjs"
      - "tests/py_launch.test.cjs"
      - "tests/fixtures/py_launch/**"
      - ".github/workflows/py-launch-tests.yml"
  push:
    branches: [main]
    paths:
      - "py_launch.cjs"
      - "tests/py_launch.test.cjs"
      - "tests/fixtures/py_launch/**"
      - ".github/workflows/py-launch-tests.yml"

jobs:
  node-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: false
      - name: Run py_launch unit tests
        run: node --test tests/py_launch.test.cjs
