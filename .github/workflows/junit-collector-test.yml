name: Test shared JUnit collector
on:
  pull_request:
    paths:
      - ".github/workflows/*junit*"
      - "tests/test_junit_collection.py"
      - "pyproject.toml"
      - "uv.lock"
  push:
    paths:
      - ".github/workflows/*junit*"
      - "tests/test_junit_collection.py"
      - "pyproject.toml"
      - "uv.lock"
permissions:
  contents: read
  actions: read
env:
  UV_LOCKED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/xprobe
          ref: 7e7015b2df69ad446b968f6fa49711b5b1dbdd3f
          path: shared-xprobe
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          cache-python: true
      - run: uv run pytest -q tests/test_junit_collection.py --junitxml=build/collector-tests.xml
        env:
          XPROBE_SOURCE: shared-xprobe/xprobe.py
      - name: Preserve raw JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-collector-tests
          path: build/collector-tests.xml
          if-no-files-found: error
          retention-days: 14
  collect:
    needs: test
    if: always()
    uses: ./.github/workflows/reusable-junit-identity.yml
    with:
      expected-reports: '["junit-collector-tests/collector-tests.xml"]'
      output-artifact: collector-test-identity
      commit-sha: ${{ github.sha }}
