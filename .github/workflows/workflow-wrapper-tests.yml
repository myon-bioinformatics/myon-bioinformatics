name: Test GitHub workflow wrapper
on:
  pull_request:
    paths:
      - "gh_workflow.py"
      - "tests/test_gh_workflow.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/workflow-wrapper-tests.yml"
  push:
    branches: [main]
    paths:
      - "gh_workflow.py"
      - "tests/test_gh_workflow.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/workflow-wrapper-tests.yml"
permissions:
  contents: read
env:
  UV_LOCKED: "1"

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
          cache-python: true
      - run: python -m py_compile gh_workflow.py
      - run: uv run pytest -q tests/test_gh_workflow.py --junitxml=reports/workflow-wrapper.xml
      - name: Preserve JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workflow-wrapper-junit-py${{ matrix.python }}
          path: reports/workflow-wrapper.xml
          if-no-files-found: error
          retention-days: 14
