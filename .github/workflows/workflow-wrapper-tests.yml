name: Test GitHub workflow wrapper
on:
  pull_request:
    paths:
      - "gh_workflow.py"
      - "tests/test_gh_workflow.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/actions.lock"
      - ".github/workflows/workflow-wrapper-tests.yml"
  push:
    branches: [main]
    paths:
      - "gh_workflow.py"
      - "tests/test_gh_workflow.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/actions.lock"
      - ".github/workflows/workflow-wrapper-tests.yml"
permissions:
  contents: read
env:
  UV_LOCKED: "1"

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "latest"
          python-version: "${{ matrix.python }}"
          activate-environment: true
          enable-cache: false
      - run: python -m py_compile gh_workflow.py
      - run: uv run pytest -q tests/test_gh_workflow.py --junitxml=reports/workflow-wrapper.xml
      - name: Preserve JUnit report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: workflow-wrapper-junit-py${{ matrix.python }}
          path: reports/workflow-wrapper.xml
          if-no-files-found: error
          retention-days: 14
