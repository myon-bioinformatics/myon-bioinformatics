name: Vendor fleet registration plan

on:
  pull_request:
    paths:
      - "vendor-catalog.json"
      - "vendor-consumers.json"
      - "vendor_catalog.py"
      - "vendor_consumers.py"
      - "vendor_fleet_plan.py"
      - "tests/test_vendor_fleet_plan.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/vendor-fleet-plan.yml"
  push:
    branches: [main]
    paths:
      - "vendor-catalog.json"
      - "vendor-consumers.json"
      - "vendor_catalog.py"
      - "vendor_consumers.py"
      - "vendor_fleet_plan.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/vendor-fleet-plan.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  registration-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: false
      - name: Generate read-only registration plan
        run: |
          mkdir -p reports
          python -S vendor_fleet_plan.py > reports/vendor-fleet-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("reports/vendor-fleet-plan.json").read_text(encoding="utf-8"))
          print("Registration statuses:", report["counts"])
          PY
      - name: Verify planner regression tests
        run: |
          uv run pytest -q tests/test_vendor_fleet_plan.py
      - name: Keep auditable registration report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vendor-fleet-plan
          path: reports/vendor-fleet-plan.json
          if-no-files-found: error
          retention-days: 14
