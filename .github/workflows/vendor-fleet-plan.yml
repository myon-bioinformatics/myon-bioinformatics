name: Vendor fleet registration plan

on:
  pull_request:
    paths:
      - "vendor-catalog.json"
      - "vendor-consumers.json"
      - "vendor_catalog.py"
      - "vendor_consumers.py"
      - "vendor_fleet_plan.py"
      - "tests/test_vendor_fleet_plan.py"
      - "pyproject.toml"
      - ".github/workflows/vendor-fleet-plan.yml"
  push:
    branches: [main]
    paths:
      - "vendor-catalog.json"
      - "vendor-consumers.json"
      - "vendor_catalog.py"
      - "vendor_consumers.py"
      - "vendor_fleet_plan.py"
      - "pyproject.toml"
      - ".github/workflows/vendor-fleet-plan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registration-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          cache-python: true
      - name: Generate read-only registration plan
        run: |
          mkdir -p reports
          python -S vendor_fleet_plan.py > reports/vendor-fleet-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("reports/vendor-fleet-plan.json").read_text(encoding="utf-8"))
          print("Registration statuses:", report["counts"])
          PY
      - name: Verify planner regression tests
        run: |
          uv run pytest -q tests/test_vendor_fleet_plan.py
      - name: Keep auditable registration report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vendor-fleet-plan
          path: reports/vendor-fleet-plan.json
          if-no-files-found: error
          retention-days: 14
