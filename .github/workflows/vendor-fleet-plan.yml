name: Vendor fleet registration plan

on:
  pull_request:
    paths:
      - "vendor-catalog.json"
      - "vendor-consumers.json"
      - "vendor_catalog.py"
      - "vendor_consumers.py"
      - "vendor_fleet_plan.py"
      - "tests/test_vendor_fleet_plan.py"
      - ".github/workflows/vendor-fleet-plan.yml"
  push:
    branches: [main]
    paths:
      - "vendor-catalog.json"
      - "vendor-consumers.json"
      - "vendor_fleet_plan.py"
      - ".github/workflows/vendor-fleet-plan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registration-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate read-only registration plan
        run: |
          mkdir -p reports
          python -S vendor_fleet_plan.py > reports/vendor-fleet-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("reports/vendor-fleet-plan.json").read_text(encoding="utf-8"))
          print("Registration statuses:", report["counts"])
          PY
      - name: Verify planner regression tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_vendor_fleet_plan.py
      - name: Keep auditable registration report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vendor-fleet-plan
          path: reports/vendor-fleet-plan.json
          if-no-files-found: error
          retention-days: 14
