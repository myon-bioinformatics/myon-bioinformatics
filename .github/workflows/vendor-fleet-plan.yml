name: Vendor fleet registration plan

on:
  pull_request:
    paths:
      - "vendor-catalog.json"
      - "vendor-consumers.json"
      - "vendor_catalog.py"
      - "vendor_consumers.py"
      - "vendor_fleet_plan.py"
      - "fleet_records.py"
      - "vendor_sync.py"
      - "child-heads.json"
      - "tests/test_vendor_fleet_plan.py"
      - "tests/test_vendor_fleet_graph.py"
      - "tests/test_fleet_records.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/vendor-fleet-plan.yml"
  push:
    branches: [main]
    paths:
      - "vendor-catalog.json"
      - "vendor-consumers.json"
      - "vendor_catalog.py"
      - "vendor_consumers.py"
      - "vendor_fleet_plan.py"
      - "fleet_records.py"
      - "vendor_sync.py"
      - "child-heads.json"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/vendor-fleet-plan.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  registration-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: Generate read-only registration plan
        run: |
          mkdir -p reports
          python -S vendor_fleet_plan.py > reports/vendor-fleet-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("reports/vendor-fleet-plan.json").read_text(encoding="utf-8"))
          print("Registration statuses:", report["counts"])
          PY
      # Offline consistency: the parent's records alone (no clone, no network). pytest coverage of the
      # planner stays in python-tests.yml; this lane proves the stdlib-only (-S) entry point and graph.
      - name: Offline fleet graph from the parent records
        run: |
          python -S vendor_fleet_plan.py graph --check --format markdown --out reports/vendor-fleet-graph.json >> "$GITHUB_STEP_SUMMARY"
      - name: Fleet entry point on synthetic local repositories (python -S, no network)
        run: |
          python -S -m unittest discover -s tests -p test_vendor_fleet_graph.py -v
          python -S -m unittest discover -s tests -p test_fleet_records.py -v
      - name: Keep auditable registration report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vendor-fleet-plan
          path: |
            reports/vendor-fleet-plan.json
            reports/vendor-fleet-graph.json
          if-no-files-found: error
          retention-days: 14
