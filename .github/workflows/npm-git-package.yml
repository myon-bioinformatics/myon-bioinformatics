name: npm Git distribution smoke
on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - py_launch.cjs
      - tests/test_npm_package.cjs
      - docs/npm-git-source-migration.md
      - .github/workflows/npm-git-package.yml
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - py_launch.cjs
      - tests/test_npm_package.cjs
      - docs/npm-git-source-migration.md
      - .github/workflows/npm-git-package.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Exact root npm lock (zero third-party runtime dependencies)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Package contents and isolated offline consumer
        run: npm test
