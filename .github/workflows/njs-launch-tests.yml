name: njs_launch tests

on:
  pull_request:
    paths:
      - "njs_launch.py"
      - "tests/test_njs_launch.py"
      - "tests/fixtures/njs_launch/**"
      - ".github/workflows/njs-launch-tests.yml"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - "njs_launch.py"
      - "tests/test_njs_launch.py"
      - "tests/fixtures/njs_launch/**"
      - ".github/workflows/njs-launch-tests.yml"
      - "pyproject.toml"
      - "uv.lock"

env:
  UV_LOCKED: "1"

jobs:
  stdlib-py39:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.9"
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: Run njs_launch unit tests (Python 3.9)
        run: uv run --python 3.9 --no-project --with pytest==8.4.2 pytest -q tests/test_njs_launch.py

  node-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [26, latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "${{ matrix.python }}"
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: Run njs_launch unit tests
        run: uv run pytest -q tests/test_njs_launch.py
