name: Sync canonical README

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'
  pull_request:
    paths:
      - README.md
      - scripts/sync-readme.mjs
      - .github/workflows/sync-readme.yml

permissions:
  contents: read

jobs:
  validate-readme:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate README from canonical data
        run: node scripts/sync-readme.mjs

      - name: Ensure generated blocks are committed
        shell: bash
        run: git diff --exit-code -- README.md

  sync-readme:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync README generated blocks
        run: node scripts/sync-readme.mjs

      - name: Commit generated README when changed
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "README already matches canonical SSOT."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Sync README from canonical SSOT"
          git push
