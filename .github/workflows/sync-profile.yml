name: Sync canonical profile

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'

permissions:
  contents: write

jobs:
  sync-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync profile block
        run: node scripts/sync-profile.mjs

      - name: Commit generated README when changed
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "README already matches canonical profile."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Sync profile from canonical profile.json"
          git push
