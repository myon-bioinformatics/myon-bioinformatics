name: Pages

on:
  push:
    branches: [main]
    paths:
      - ci_status.py
      - scripts/build_audit_pages.py
      - scripts/verify_pages_artifact.py
      - scripts/unified_operations.py
      - assets/brand/favicon.ico
      - assets/brand/favicon.png
      - vendor_fleet_plan.py
      - fleet_records.py
      - pyproject.toml
      - uv.lock
      - vendor/gh_identity.py
      - site/**
      - docs/audit-pages.md
      - .github/workflows/pages.yml
      - .github/workflows/reusable-pages-static.yml
  pull_request:
    paths:
      - ci_status.py
      - scripts/build_audit_pages.py
      - scripts/verify_pages_artifact.py
      - scripts/unified_operations.py
      - assets/brand/favicon.ico
      - assets/brand/favicon.png
      - vendor_fleet_plan.py
      - fleet_records.py
      - site/**
      - tests/test_audit_pages.py
      - tests/test_audit_model.cjs
      - tests/test_workflows.py
      - tests/fixtures/guide-backlinks/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/pages.yml
      - .github/workflows/reusable-pages-static.yml
  schedule:
    - cron: "17 21 * * *" # 06:17 JST; daily observations (PRs/CI and the vendor fleet audit), first successful build per ISO week retained

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: Test audit producer and publication failure boundaries
        # 📦 The pages group: the pinned PySaiyanWeBoo the audit pages render through (pyproject.toml).
        run: |
          uv run --locked --only-group pages python -m unittest discover -s tests -p test_ci_status.py
          uv run --locked --only-group pages python -m unittest discover -s tests -p test_audit_pages.py
          uv run --locked --only-group pages python -m unittest discover -s tests -p test_unified_operations.py
          node --check site/ui/unified-app.js
          node --check site/ui/unified-model.js
          node --check site/ui/shared-ui.js
          node --check site/ui/app.js
          node --test tests/test_audit_model.cjs
  live-smoke:
    needs: validate
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: Build from live public observations without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --locked --only-group pages python scripts/build_audit_pages.py
          --repos cli_args,xprobe --previous '' --previous-history ''
          --out /tmp/audit-live-smoke
      - name: Verify generated dashboard artifact
        run: |
          tar -cf "$RUNNER_TEMP/audit-live-smoke.tar" -C /tmp/audit-live-smoke .
          python3 -S scripts/verify_pages_artifact.py "$RUNNER_TEMP/audit-live-smoke.tar"
  guide-backlinks:
    # Pull requests only: on the default branch this would upload and deploy the fixture.
    # pages/id-token write is required to call the reusable workflow (it declares a deploy
    # job); that job stays skipped here because this is a pull request and build is unset.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/reusable-pages-static.yml
    with:
      artifact_path: _site
      guide_page: tests/fixtures/guide-backlinks/guide.page.json
  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/reusable-pages-static.yml
    with:
      artifact_path: site/dist
      build: uv run --locked --only-group pages python scripts/build_audit_pages.py

