name: Pinned vendor consumer compatibility

on:
  pull_request:
    paths:
      - "vendor_sync.py"
      - "vendor.lock.json"
      - "vendor_consumers.py"
      - "vendor-consumers.json"
      - "tests/test_vendor_consumers_compat.py"
      - "pyproject.toml"
      - ".github/workflows/vendor-consumers-compat.yml"
  push:
    branches: [main]
    paths:
      - "vendor_sync.py"
      - "vendor.lock.json"
      - "vendor_consumers.py"
      - "vendor-consumers.json"
      - "tests/test_vendor_consumers_compat.py"
      - "pyproject.toml"
      - ".github/workflows/vendor-consumers-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  old-new-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VENDOR_LEGACY_ROOT: .compat/parent-old
      VENDOR_SHORTHAND_ROOT: .compat/parent-shorthand
      IRONMATE_COMPAT_ROOT: .compat/ironmate
    steps:
      - name: Checkout proposed parent version
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout historical tool and registry as one unit
        uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 1eda992aa6fa31a902e2c06428e53ab17e8fe3c1
          path: .compat/parent-old
          persist-credentials: false
      - name: Checkout immutable license-shorthand registry fixture
        uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: a9df23dec720f125772a24b77b413552d60060ba
          path: .compat/parent-shorthand
          persist-credentials: false
      - name: Checkout historical audited Ironmate snapshot
        uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/Ironmate
          ref: 77cd700f961f2a97051da96b9c13a6c7a64258df
          path: .compat/ironmate
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          cache-python: true
      - name: Check the original Ironmate lock and file bytes with both verifiers
        run: |
          python -S .compat/parent-old/vendor_sync.py check --root .compat/ironmate --manifest vendor.lock.json
          python -S vendor_sync.py check --root .compat/ironmate --manifest vendor.lock.json
      - name: Exercise all four tool/registry combinations and Ironmate compare
        run: |
          uv run pytest -q tests/test_vendor_consumers_compat.py --junitxml=reports/vendor-consumers-compat.xml
      - name: Preserve compatibility results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vendor-consumers-compat
          path: reports/vendor-consumers-compat.xml
          if-no-files-found: warn
          retention-days: 14
