name: Vendor consumer lock reconciliation

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * 1"  # weekly read-only drift report (Monday 00:30 UTC = 09:30 JST)
  pull_request:
    paths:
      - "vendor-catalog.json"
      - "vendor-consumers.json"
      - "vendor_catalog.py"
      - "vendor_consumers.py"
      - "vendor_fleet_plan.py"
      - "vendor_sync.py"
      - "vendor_lock_reconcile.py"
      - "docs/vendor-registration-review.json"
      - "tests/test_vendor_lock_reconcile.py"
      - "tests/test_flutter_vendor_registry_sync.py"
      - ".github/workflows/vendor-lock-reconciliation.yml"
  push:
    branches: [main]
    paths:
      - "vendor-catalog.json"
      - "vendor-consumers.json"
      - "vendor_catalog.py"
      - "vendor_consumers.py"
      - "vendor_fleet_plan.py"
      - "vendor_sync.py"
      - "vendor_lock_reconcile.py"
      - "docs/vendor-registration-review.json"
      - "tests/test_vendor_lock_reconcile.py"
      - "tests/test_flutter_vendor_registry_sync.py"
      - ".github/workflows/vendor-lock-reconciliation.yml"

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Unit regressions
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_vendor_lock_reconcile.py tests/test_vendor_consumers.py tests/test_vendor_catalog.py tests/test_vendor_fleet_plan.py
      - name: Fetch real consumer locks (read only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports
          python -S vendor_lock_reconcile.py \
            --consumer myon-bioinformatics/flutter_navigation_basic \
            --consumer myon-bioinformatics/mcp-toolcall-lab \
            --review docs/vendor-registration-review.json \
            --output reports/vendor-lock-reconciliation.json
      - name: Summarize separate lock drift and registration review
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("reports/vendor-lock-reconciliation.json").read_text(encoding="utf-8"))
          for row in report["results"]:
              print(row["consumer"], row.get("counts"), row.get("lock_provenance", {}).get("commit"))
          PY
      - name: Upload machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vendor-lock-reconciliation
          path: reports/vendor-lock-reconciliation.json
          if-no-files-found: warn
          retention-days: 14

  duplicate-files:
    name: Cross-repository duplicate files (read only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pinned to gh_identity main merge commit 7492d73 (#56; first-parent verified).
      GH_IDENTITY_SHA: 7492d73d909b4ea8ab5ffb3437fc4710469e8650
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch pinned gh_identity
        uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/gh_identity
          ref: ${{ env.GH_IDENTITY_SHA }}
          path: .gh-identity
          persist-credentials: false
      - name: Verify pin
        run: test "$(git -C .gh-identity rev-parse HEAD)" = "$GH_IDENTITY_SHA"
      - name: Duplicate files with vendor-lock provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports
          python -S .gh-identity/gh_identity.py --timeout 900 duplicate-files --owner myon-bioinformatics > reports/duplicate-files.json
          python -S - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          sys.path.insert(0, ".gh-identity")
          import gh_identity
          report = json.load(open("reports/duplicate-files.json", encoding="utf-8"))
          print(gh_identity.render_duplicates_markdown(report, top=30))
          PY
      - name: Upload duplicate-files report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: duplicate-files
          path: reports/duplicate-files.json
          if-no-files-found: warn
          retention-days: 14
