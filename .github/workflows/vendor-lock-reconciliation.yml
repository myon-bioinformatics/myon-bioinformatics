name: Vendor consumer lock reconciliation

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * 1"  # weekly read-only drift report (Monday 00:30 UTC = 09:30 JST)
  pull_request:
    paths:
      - "vendor-catalog.json"
      - "vendor-consumers.json"
      - "child-heads.json"
      - "vendor_catalog.py"
      - "vendor_consumers.py"
      - "vendor_fleet_plan.py"
      - "vendor_sync.py"
      - "vendor_lock_reconcile.py"
      - "duplicate_files_report.py"
      - "docs/vendor-registration-review.json"
      - "tests/test_vendor_lock_reconcile.py"
      - "tests/test_duplicate_files_report.py"
      - "tests/test_flutter_vendor_registry_sync.py"
      - "pyproject.toml"
      - ".github/workflows/vendor-lock-reconciliation.yml"
  push:
    branches: [main]
    paths:
      - "vendor-catalog.json"
      - "vendor-consumers.json"
      - "child-heads.json"
      - "vendor_catalog.py"
      - "vendor_consumers.py"
      - "vendor_fleet_plan.py"
      - "vendor_sync.py"
      - "vendor_lock_reconcile.py"
      - "duplicate_files_report.py"
      - "docs/vendor-registration-review.json"
      - "tests/test_vendor_lock_reconcile.py"
      - "tests/test_duplicate_files_report.py"
      - "tests/test_flutter_vendor_registry_sync.py"
      - "pyproject.toml"
      - ".github/workflows/vendor-lock-reconciliation.yml"

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          cache-python: true
      - name: Unit regressions
        run: uv run pytest -q tests/test_vendor_lock_reconcile.py tests/test_vendor_consumers.py tests/test_vendor_catalog.py tests/test_vendor_fleet_plan.py tests/test_duplicate_files_report.py
      - name: Fetch real consumer locks (read only)
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p reports
          args=(
            --consumer myon-bioinformatics/flutter_navigation_basic
            --consumer myon-bioinformatics/mcp-toolcall-lab
            --review docs/vendor-registration-review.json
            --output reports/vendor-lock-reconciliation.json
          )
          # PRs validate the proposed parent baseline, including coordinated
          # child relocations. Main/dispatch still observe actual live main.
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            args+=(--heads child-heads.json)
          fi
          python -S vendor_lock_reconcile.py "${args[@]}"
      - name: Summarize separate lock drift and registration review
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("reports/vendor-lock-reconciliation.json").read_text(encoding="utf-8"))
          for row in report["results"]:
              print(row["consumer"], row.get("counts"), row.get("lock_provenance", {}).get("commit"))
          PY
      - name: Upload machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vendor-lock-reconciliation
          path: reports/vendor-lock-reconciliation.json
          if-no-files-found: warn
          retention-days: 14

  duplicate-files:
    name: Cross-repository duplicate files (read only)
    # PR/push validate the adapter offline; scheduled/manual runs use the verified lock.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify locked gh_identity (offline)
        run: python -S vendor_sync.py check --manifest vendor.lock.json
      - name: Duplicate files with vendor-lock provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -S duplicate_files_report.py \
            --identity vendor/gh_identity.py \
            --output reports/duplicate-files.json \
            --timeout 900 \
            --owner myon-bioinformatics
      - name: Upload duplicate-files report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: duplicate-files
          path: |
            reports/duplicate-files.json
            reports/duplicate-files.md
            reports/duplicate-files.stderr.log
          if-no-files-found: warn
          retention-days: 14
