name: Reusable JUnit failure identity

on:
  workflow_call:
    inputs:
      artifact-pattern:
        description: "Raw JUnit artifacts from this workflow run"
        type: string
        default: "junit-*"
      expected-artifacts:
        description: "Newline-separated exact artifact names expected from this caller"
        type: string
        required: true
      output-artifact:
        type: string
        default: "failure-identity"

permissions:
  contents: read
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Checkout pinned importer only
        uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/xprobe
          ref: 7e7015b2df69ad446b968f6fa49711b5b1dbdd3f
          path: shared-xprobe
          persist-credentials: false
          sparse-checkout: xprobe.py
          sparse-checkout-cone-mode: false
      - name: Download raw reports
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact-pattern }}
          path: reports
          merge-multiple: false
      - name: Import bounded reports
        env:
          PYTHONPATH: shared-xprobe
          SOURCE_REPOSITORY: ${{ github.repository }}
          EXPECTED_ARTIFACTS: ${{ inputs.expected-artifacts }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys

          # Verify bytes before importing code. Caller checkout is never executed.
          data = Path("shared-xprobe/xprobe.py").read_bytes()
          blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          if blob != "dbc5b7d55005d6288c072a7612584d6170c216f4":
              raise SystemExit("Importer verification failed")
          import xprobe

          output = Path("identity")
          output.mkdir(exist_ok=True)
          summary = {"reports": [], "complete": True, "commit_sha": None}
          cases = []
          total_bytes = 0

          expected_list = [
              name.strip()
              for name in os.environ.get("EXPECTED_ARTIFACTS", "").splitlines()
              if name.strip()
          ]
          expected = set(expected_list)
          reports_root = Path("reports")
          found = {
              path.name
              for path in reports_root.iterdir()
              if path.is_dir()
          } if reports_root.is_dir() else set()

          if not expected_list:
              summary.update(complete=False, error="expected_artifacts_required")
          elif len(expected_list) != len(expected):
              summary.update(complete=False, error="duplicate_expected_artifact")
          elif len(expected) > 100:
              summary.update(complete=False, error="expected_artifact_limit")
          else:
              missing = expected - found
              unexpected = found - expected
              summary.update(
                  expected_artifacts=len(expected),
                  found_artifacts=len(found),
                  missing_artifacts=sorted(missing),
                  unexpected_artifact_count=len(unexpected),
              )
              if missing or unexpected:
                  summary["complete"] = False

              selected = []
              for artifact in sorted(expected & found):
                  artifact_root = reports_root / artifact
                  xml_paths = list(artifact_root.rglob("*.xml"))
                  if len(xml_paths) != 1:
                      summary["complete"] = False
                      summary["reports"].append({
                          "artifact": artifact,
                          "measured": False,
                          "error": "report_cardinality",
                          "report_count": len(xml_paths),
                      })
                      continue
                  selected.append((artifact, xml_paths[0]))

              for artifact, path in selected:
                  report_id = "junit-" + hashlib.sha256(
                      str(path.relative_to(reports_root)).encode()
                  ).hexdigest()
                  item = {"artifact": artifact, "report_id": report_id, "measured": False}
                  try:
                      if path.is_symlink() or not path.is_file():
                          raise ValueError("non_regular")
                      with path.open("rb") as stream:
                          raw = stream.read(1_000_001)
                      total_bytes += len(raw)
                      if total_bytes > 20_000_000 or len(raw) > 1_000_000:
                          raise ValueError("byte_limit")
                      report = xprobe.cases_from_junit(
                          raw.decode("utf-8"), repository=os.environ["SOURCE_REPOSITORY"],
                          commit_sha=None, report_id=report_id,
                      )
                      item.update(
                          measured=True,
                          truncated=report["truncated"],
                          failures=len(report["cases"]),
                      )
                      cases.extend(report["cases"])
                      if report["truncated"]:
                          summary["complete"] = False
                  except (OSError, ValueError, UnicodeError) as error:
                      item["error"] = type(error).__name__
                      summary["complete"] = False
                  summary["reports"].append(item)
                  if total_bytes > 20_000_000:
                      break

          (output / "failure-identity.jsonl").write_text(
              xprobe.corpus_to_json(cases, jsonl=True), encoding="utf-8"
          )
          (output / "collection.json").write_text(
              json.dumps(summary, sort_keys=True, indent=2), encoding="utf-8"
          )
          sys.exit(0 if summary["complete"] else 1)
          PY
      - name: Preserve collection evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.output-artifact }}
          path: identity/
          if-no-files-found: error
