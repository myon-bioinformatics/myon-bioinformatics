name: Reusable JUnit failure identity

on:
  workflow_call:
    inputs:
      expected-reports:
        description: "JSON array of exact artifact-name/report.xml paths (1–100)"
        type: string
        required: true
      artifact-pattern:
        description: "Raw JUnit artifacts from this workflow run"
        type: string
        default: "junit-*"
      output-artifact:
        type: string
        default: "failure-identity"

permissions:
  contents: read
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Checkout pinned importer only
        uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/xprobe
          ref: 7e7015b2df69ad446b968f6fa49711b5b1dbdd3f
          path: shared-xprobe
          persist-credentials: false
          sparse-checkout: xprobe.py
          sparse-checkout-cone-mode: false
      - name: Select single-artifact layout
        id: layout
        env:
          EXPECTED_REPORTS: ${{ inputs.expected-reports }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          try:
              paths = json.loads(os.environ.get("EXPECTED_REPORTS", ""))
              if not isinstance(paths, list) or not 1 <= len(paths) <= 100:
                  raise ValueError("invalid expectation")
              names = {path.split("/")[0] for path in paths if isinstance(path, str)}
              name = next(iter(names)) if len(names) == 1 else ""
              if name in (".", "..") or not re.fullmatch(r"[A-Za-z0-9_.-]*", name):
                  name = ""
          except (ValueError, TypeError):
              name = ""
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("single_artifact=" + name + "\n")
          PY
      - name: Download raw reports
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.layout.outputs.single_artifact }}
          pattern: ${{ inputs.artifact-pattern }}
          path: reports/${{ steps.layout.outputs.single_artifact }}
          merge-multiple: false
      - name: Import bounded reports
        if: always()
        env:
          PYTHONPATH: shared-xprobe
          SOURCE_REPOSITORY: ${{ github.repository }}
          EXPECTED_REPORTS: ${{ inputs.expected-reports }}
        run: |
          python - <<'PY'
          import hashlib
          import itertools
          import json
          import os
          from pathlib import Path
          import re
          import sys

          # Verify bytes before importing code. Caller checkout is never executed.
          data = Path("shared-xprobe/xprobe.py").read_bytes()
          blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          if blob != "dbc5b7d55005d6288c072a7612584d6170c216f4":
              raise SystemExit("Importer verification failed")
          import xprobe

          output = Path("identity")
          output.mkdir(exist_ok=True)
          summary = {"reports": [], "complete": True, "commit_sha": None}
          expected = []
          try:
              expected = json.loads(os.environ.get("EXPECTED_REPORTS", ""))
              if not isinstance(expected, list) or not 1 <= len(expected) <= 100:
                  raise ValueError("expected report list required")
              if any(not isinstance(name, str) or len(name) > 240 or
                     not re.fullmatch(r"[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)+\.xml", name) or
                     any(part in (".", "..") for part in name.split("/")) for name in expected):
                  raise ValueError("invalid expected report path")
              if len(set(expected)) != len(expected):
                  raise ValueError("duplicate expected report path")
          except (ValueError, TypeError):
              expected = []
              summary.update(complete=False, error="invalid_expected_reports")
          valid = set()
          unexpected = []
          cases = []
          count = 0
          total_bytes = 0
          for path in itertools.islice(Path("reports").rglob("*.xml"), 101):
              count += 1
              if count > 100:
                  summary["complete"] = False
                  summary["limit"] = "report_count"
                  break
              # Hash paths rather than publishing arbitrary artifact/file names.
              relative = path.relative_to("reports").as_posix()
              report_id = "junit-" + hashlib.sha256(relative.encode()).hexdigest()
              if relative not in expected:
                  unexpected.append(report_id)
                  summary["complete"] = False
              item = {"report_id": report_id, "measured": False}
              try:
                  if path.is_symlink() or not path.is_file():
                      raise ValueError("non_regular")
                  with path.open("rb") as stream:
                      raw = stream.read(1_000_001)
                  total_bytes += len(raw)
                  if total_bytes > 20_000_000 or len(raw) > 1_000_000:
                      raise ValueError("byte_limit")
                  report = xprobe.cases_from_junit(
                      raw.decode("utf-8"), repository=os.environ["SOURCE_REPOSITORY"],
                      commit_sha=None, report_id=report_id,
                  )
                  item.update(measured=True, truncated=report["truncated"], failures=len(report["cases"]))
                  cases.extend(report["cases"])
                  if report["truncated"]:
                      summary["complete"] = False
                  elif relative in expected:
                      valid.add(relative)
              except (OSError, ValueError, UnicodeError) as error:
                  item["error"] = type(error).__name__
                  summary["complete"] = False
              summary["reports"].append(item)
              if total_bytes > 20_000_000:
                  break
          if not count:
              summary.update(complete=False, error="no_reports")
          summary["missing_reports"] = sorted(set(expected) - valid)
          summary["unexpected_reports"] = unexpected
          if summary["missing_reports"]:
              summary["complete"] = False
          (output / "failure-identity.jsonl").write_text(xprobe.corpus_to_json(cases, jsonl=True), encoding="utf-8")
          (output / "collection.json").write_text(json.dumps(summary, sort_keys=True, indent=2), encoding="utf-8")
          sys.exit(0 if summary["complete"] else 1)
          PY
      - name: Preserve collection evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.output-artifact }}
          path: identity/
          if-no-files-found: error
