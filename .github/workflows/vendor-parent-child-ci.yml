name: Parent child CI

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      strict-pin-readiness:
        description: "Read-only strict fleet readiness audit (findings fail; no autofix)"
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - "child-heads.json"
      - "vendor-consumers.json"
      - "vendor-catalog.json"
      - "vendor_sync.py"
      - "vendor.lock.json"
      - "vendor/**"
      - "templates/vendor-child-ci.workflow.yml"
      - "templates/parent-pr.ref.json"
      - "tools/parent_pin_check.py"
      - "tests/test_parent_pin_check.py"
      - ".github/workflows/vendor-parent-child-ci.yml"
      - ".github/workflows/reusable-parent-pin-check.yml"
      - ".github/workflows/parent-pin-check.yml"
      - "tests/test_parent_ci_api_recovery.py"
      - "tests/test_vendor_public_fetch_retry.py"
      - "tests/test_vendor_child_heads.py"
      - "tests/test_vendor_child_bootstrap.py"
      - "tests/test_vendor_parent_evidence.py"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch' || !inputs.strict-pin-readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether vendor baseline validation applies
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo run=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "$BASE_REF"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              child-heads.json|vendor-consumers.json|vendor-catalog.json|vendor_sync.py|vendor.lock.json|vendor/*|templates/vendor-child-ci.workflow.yml|templates/parent-pr.ref.json|tests/test_parent_ci_api_recovery.py|tests/test_vendor_public_fetch_retry.py|tests/test_vendor_child_heads.py|tests/test_vendor_child_bootstrap.py|tests/test_vendor_parent_evidence.py)
                echo run=true >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done < <(git diff --name-only "origin/${BASE_REF}"...HEAD)
          echo run=false >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.scope.outputs.run == 'true'
        with:
          version: "0.13.3"
          python-version: "3.15"
          activate-environment: true
          enable-cache: false
      - name: Validate child heads and parent vendor baseline
        if: steps.scope.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          args=(
            run-parent-child-ci
            --root .
            --registry vendor-consumers.json
            --heads child-heads.json
            --summary "$GITHUB_STEP_SUMMARY"
          )
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            args+=(--skip-source-diff --pr-validation)
            # Entries this PR only adds to an existing child are pending
            # enrollment (report-only) until the child adopts them. Push and
            # schedule runs stay strict against the full registry.
            base_registry="$RUNNER_TEMP/base-vendor-consumers.json"
            git show "$PR_BASE_SHA:vendor-consumers.json" > "$base_registry"
            args+=(--base-registry "$base_registry")
          fi
          python -S vendor_sync.py "${args[@]}"
      - name: Unit regressions (offline)
        if: steps.scope.outputs.run == 'true'
        run: |
          uv run pytest -q tests/test_parent_ci_api_recovery.py tests/test_vendor_public_fetch_retry.py tests/test_vendor_child_heads.py tests/test_vendor_child_bootstrap.py tests/test_vendor_parent_evidence.py

  child-parent-pin-freshness:
    name: Strict parent pin rollout readiness (manual)
    # Automatic enforcement is a later parent-owned rollout, tracked in #56.
    # This explicit readiness run stays strict; findings are never made green.
    if: github.event_name == 'workflow_dispatch' && inputs.strict-pin-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.3"
          python-version: "3.15"
          activate-environment: true
          enable-cache: false
      - name: Require a complete fleet with no stale or mixed parent pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports
          python tools/parent_pin_check.py --fleet --child-heads child-heads.json \
            --enforce --require-complete --output reports/parent-pin-readiness.json \
            2>&1 | tee reports/parent-pin-readiness.log
      - name: Summarize strict readiness even after failure
        if: always()
        run: |
          {
            echo '## Strict parent pin rollout readiness (manual)'
            echo 'Automatic fleet enforcement is not enabled; follow-up is tracked in parent issue #56.'
            echo 'A successful ordinary PR/schedule run is not a clean-fleet approval.'
            echo '```text'
            if [[ -f reports/parent-pin-readiness.log ]]; then
              cat reports/parent-pin-readiness.log
            else
              echo 'INCOMPLETE: readiness audit did not produce a log.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve strict readiness evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parent-pin-readiness
          path: |
            reports/parent-pin-readiness.json
            reports/parent-pin-readiness.log
          if-no-files-found: warn
          retention-days: 14

  autofix:
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.strict-pin-readiness)) }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.3"
          python-version: "3.15"
          activate-environment: true
          enable-cache: false
      - name: Refresh child-heads and open or update autofix pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -S vendor_sync.py run-parent-child-ci \
            --root . \
            --registry vendor-consumers.json \
            --heads child-heads.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            --autofix
