name: Parent child CI

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "child-heads.json"
      - "vendor-consumers.json"
      - "vendor_sync.py"
      - "vendor.lock.json"
      - "vendor/**"
      - ".github/workflows/vendor-parent-child-ci.yml"
      - ".github/workflows/reusable-vendor-child-ci.yml"
      - "tests/test_vendor_child_heads.py"

permissions:
  contents: write
  pull-requests: write

jobs:
  parent-child-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run parent child CI (SHA, source diff, parent vendor baseline)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(
            run-parent-child-ci
            --root .
            --registry vendor-consumers.json
            --heads child-heads.json
            --summary "$GITHUB_STEP_SUMMARY"
          )
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            args+=(--autofix)
          else
            args+=(--skip-source-diff)
          fi
          python -S vendor_sync.py "${args[@]}"
      - name: Unit regressions (offline)
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_vendor_child_heads.py
