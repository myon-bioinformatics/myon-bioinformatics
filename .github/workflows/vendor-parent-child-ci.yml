name: Parent child CI

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "child-heads.json"
      - "vendor-consumers.json"
      - "vendor-catalog.json"
      - "vendor_sync.py"
      - "vendor.lock.json"
      - "vendor/**"
      - "templates/vendor-child-ci.workflow.yml"
      - "templates/parent-pr.ref.json"
      - "tools/parent_pin_check.py"
      - "tests/test_parent_pin_check.py"
      - ".github/workflows/vendor-parent-child-ci.yml"
      - ".github/workflows/reusable-parent-pin-check.yml"
      - ".github/workflows/parent-pin-check.yml"
      - "tests/test_vendor_child_heads.py"
      - "tests/test_vendor_child_bootstrap.py"
      - "tests/test_vendor_parent_evidence.py"

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether vendor baseline validation applies
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo run=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "$BASE_REF"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              child-heads.json|vendor-consumers.json|vendor-catalog.json|vendor_sync.py|vendor.lock.json|vendor/*|templates/vendor-child-ci.workflow.yml|templates/parent-pr.ref.json|tests/test_vendor_child_heads.py|tests/test_vendor_child_bootstrap.py|tests/test_vendor_parent_evidence.py)
                echo run=true >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done < <(git diff --name-only "origin/${BASE_REF}"...HEAD)
          echo run=false >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Validate child heads and parent vendor baseline
        if: steps.scope.outputs.run == 'true'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          args=(
            run-parent-child-ci
            --root .
            --registry vendor-consumers.json
            --heads child-heads.json
            --summary "$GITHUB_STEP_SUMMARY"
          )
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            args+=(--skip-source-diff --pr-validation)
          fi
          python -S vendor_sync.py "${args[@]}"
      - name: Unit regressions (offline)
        if: steps.scope.outputs.run == 'true'
        run: |
          python -m pip install -r tests/requirements.txt
          python -m pytest -q tests/test_vendor_child_heads.py tests/test_vendor_child_bootstrap.py tests/test_vendor_parent_evidence.py

  child-parent-pin-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check public child main branches for stale parent pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          python tools/parent_pin_check.py --fleet --child-heads child-heads.json --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF"

  autofix:
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Refresh child-heads and open or update autofix pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -S vendor_sync.py run-parent-child-ci \
            --root . \
            --registry vendor-consumers.json \
            --heads child-heads.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            --autofix
