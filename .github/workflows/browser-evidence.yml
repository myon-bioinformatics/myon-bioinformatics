name: Browser capture evidence
on:
  pull_request:
    paths:
      - browser_evidence.py
      - tools/browser/**
      - .github/workflows/browser-evidence.yml
  workflow_dispatch:

permissions:
  contents: read
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: stagehand
            package: '@browserbasehq/stagehand@4.2.0'
          - engine: playwright
            package: playwright@1.64.0
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install capture SDK and Chrome for Testing
        env:
          SDK: ${{ matrix.package }}
        run: |
          npm install --prefix tools/browser --ignore-scripts --no-save --no-package-lock "$SDK"
          if [[ "$SDK" == playwright@* ]]; then
            tools/browser/node_modules/.bin/playwright install --with-deps --only-shell chromium
          else
            google-chrome --version
          fi
      - name: Capture and verify screenshot from this checkout
        env:
          ENGINE: ${{ matrix.engine }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -m http.server 8020 --bind 127.0.0.1 --directory site/ui &
          server=$!
          trap 'kill "$server"' EXIT
          url=http://127.0.0.1:8020/evidence.html
          curl -fsS --retry 10 --retry-connrefused "$url" -o /dev/null
          node tools/browser/capture.mjs "$ENGINE" "$url" evidence "$GITHUB_RUN_ID"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from browser_evidence import record
          engine = os.environ["ENGINE"]
          root = Path("evidence") / engine
          manifest = json.loads((root / "evidence.json").read_text())
          expected = record(engine, root / "screenshot.png", root,
                            run_id=os.environ["GITHUB_RUN_ID"], head_sha=os.environ["EXPECTED_SHA"])
          assert manifest == expected
          print(json.dumps(expected))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence-${{ matrix.engine }}-${{ github.run_attempt }}
          path: evidence/${{ matrix.engine }}/
          if-no-files-found: error
          retention-days: 14
