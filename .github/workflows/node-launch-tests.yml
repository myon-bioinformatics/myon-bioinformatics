name: node_launch tests

on:
  pull_request:
    paths:
      - "node_launch.py"
      - "tests/test_node_launch.py"
      - "tests/fixtures/node_launch/**"
      - ".github/workflows/node-launch-tests.yml"
  push:
    branches: [main]
    paths:
      - "node_launch.py"
      - "tests/test_node_launch.py"
      - "tests/fixtures/node_launch/**"
      - ".github/workflows/node-launch-tests.yml"

jobs:
  node-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run node_launch unit tests
        run: python -m pytest -q tests/test_node_launch.py
