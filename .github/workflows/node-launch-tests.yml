name: node_launch tests

on:
  pull_request:
    paths:
      - "node_launch.py"
      - "tests/test_node_launch.py"
      - "tests/test_node_launch_cli_args_parity.py"
      - "tests/fixtures/node_launch/**"
      - ".github/workflows/node-launch-tests.yml"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - "node_launch.py"
      - "tests/test_node_launch.py"
      - "tests/test_node_launch_cli_args_parity.py"
      - "tests/fixtures/node_launch/**"
      - ".github/workflows/node-launch-tests.yml"
      - "pyproject.toml"
      - "uv.lock"

env:
  UV_LOCKED: "1"

jobs:
  stdlib-py39:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.3"
          python-version: "3.9"
          enable-cache: false
      - name: Run node_launch unit tests (Python 3.9)
        run: uv run --python 3.9 --no-project --with pytest==8.4.2 pytest -q tests/test_node_launch.py tests/test_node_launch_cli_args_parity.py

  node-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24, latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.3"
          python-version: "${{ matrix.python }}"
          enable-cache: false
      - name: Run node_launch unit tests
        run: uv run pytest -q tests/test_node_launch.py tests/test_node_launch_cli_args_parity.py
