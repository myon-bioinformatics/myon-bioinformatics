name: node_launch tests

on:
  pull_request:
    paths:
      - "node_launch.py"
      - "tests/test_node_launch.py"
      - "tests/test_node_launch_cli_args_parity.py"
      - "tests/fixtures/node_launch/**"
      - ".github/workflows/node-launch-tests.yml"
  push:
    branches: [main]
    paths:
      - "node_launch.py"
      - "tests/test_node_launch.py"
      - "tests/test_node_launch_cli_args_parity.py"
      - "tests/fixtures/node_launch/**"
      - ".github/workflows/node-launch-tests.yml"

jobs:
  node-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24, latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: python -m pip install -r tests/requirements.txt
      - name: Run node_launch unit tests
        run: python -m pytest -q tests/test_node_launch.py tests/test_node_launch_cli_args_parity.py
