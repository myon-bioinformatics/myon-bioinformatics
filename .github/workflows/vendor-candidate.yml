name: Recommended vendor candidate

on:
  pull_request:
    paths:
      - "vendor_candidate.py"
      - "vendor_catalog.py"
      - "vendor_consumers.py"
      - "vendor_sync.py"
      - "vendor-catalog.json"
      - "vendor-consumers.json"
      - "vendor.lock.json"
      - "vendor/**"
      - "gh_ops.py"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/vendor-candidate.yml"
  push:
    branches: [main]
    paths:
      - "vendor*.py"
      - "vendor*.json"
      - "vendor/**"
      - "gh_ops.py"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/vendor-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  gh-identity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.3"
          python-version: "${{ matrix.python }}"
          enable-cache: false
      - name: Test candidate verifier offline
        run: uv run pytest -q tests/test_vendor_candidate.py --junitxml=reports/verifier.xml
      - name: Verify recommended gh_identity in disposable consumer
        env:
          CANDIDATE_OUTPUT: ${{ runner.temp }}/vendor-candidate-py${{ matrix.python }}
        run: >-
          uv run python -S vendor_candidate.py --root .
          --consumer myon-bioinformatics/myon-bioinformatics
          --repository myon-bioinformatics/gh_identity --source gh_identity.py
          --test tests/test_gh_ops.py --output "$CANDIDATE_OUTPUT"
      - name: Preserve verification and candidate JUnit (including failures)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vendor-candidate-gh-identity-py${{ matrix.python }}
          path: ${{ runner.temp }}/vendor-candidate-py${{ matrix.python }}/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve verifier JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-vendor-candidate-verifier-py${{ matrix.python }}
          path: reports/verifier.xml
          if-no-files-found: error
          retention-days: 14
