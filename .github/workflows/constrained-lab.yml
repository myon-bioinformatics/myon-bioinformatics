name: Constrained lab smoke
on:
  pull_request:
    paths:
      - 'tools/constrained_lab.py'
      - 'tools/constrained_lab_bench.py'
      - 'tools/constrained_lab_resources.py'
      - 'tools/constrained_lab_algorithms.py'
      - 'tools/constrained_lab_fixtures.py'
      - 'tools/constrained_lab_oss.py'
      - 'tools/constrained_lab_integrate.py'
      - 'tests/test_constrained_lab.py'
      - 'tests/test_constrained_lab_bench.py'
      - 'tests/test_constrained_lab_resources.py'
      - 'tests/test_constrained_lab_algorithms.py'
      - 'tests/test_constrained_lab_fixtures.py'
      - 'tests/test_constrained_lab_oss.py'
      - 'tests/test_constrained_lab_integrate.py'
      - '.github/workflows/constrained-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: constrained-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Offline stdlib smoke
        run: |
          PYTHONPATH=. python -S -m unittest discover -s tests -p 'test_constrained_lab*.py' -v
