name: Live Pages guide smoke

on:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  guides:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install existing Playwright browser runner
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check live guide pages at 390px and 1200px
        run: python scripts/check_live_pages.py
      - name: Preserve results and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-pages-guide-smoke
          path: pages-smoke-results/
          if-no-files-found: warn
