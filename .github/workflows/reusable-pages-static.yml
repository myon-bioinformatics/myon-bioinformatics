name: Reusable static Pages deploy

on:
  workflow_call:
    inputs:
      artifact_path:
        description: "Explicit directory to upload to GitHub Pages"
        required: true
        type: string
      build:
        description: "Optional shell command that produces artifact_path (runs after checkout; the runner's python3 and GITHUB_TOKEN as GH_TOKEN are available)"
        required: false
        type: string
        default: ""
      guide_page:
        description: "Optional web-ui-page/1 spec (data only). It is rendered to artifact_path/index.html with the PySaiyanWeBoo pinned here, and pull requests build it without deploying"
        required: false
        type: string
        default: ""
      guide_assets:
        description: "Optional files or folders copied next to the guide, as space-separated SOURCE=NAME pairs (for example docs/brand/icon.png=icon.png docs/demos=demos)"
        required: false
        type: string
        default: ""
      guide_brand:
        description: "Optional CaChereCyCle id prefix, the repository name as written (for example xprobe): <prefix>.icon and <prefix>.favicon are written next to the guide as icon.png, favicon.png and square icon-180/192/512.png, so the repository keeps no copies"
        required: false
        type: string
        default: ""
      guide_dir:
        description: "Optional folder inside artifact_path for the guide (for example guide), when the Pages already has its own front page; empty: artifact_path itself"
        required: false
        type: string
        default: ""
      guide_features:
        description: "Optional Python files whose every CLI command and public name fill the guide's 📚 機能全一覧 tab (space-separated, see PySaiyanWeBoo add_features). Empty: <repository name>.py (lower case, - as _), else <initials>.py (search_seq_including_spaces → ssis.py), when it exists; - turns it off"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # One group per ref: a pull request build never cancels a deployment from the default branch.
  group: "pages-${{ github.repository }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  # The one pin for every guide page; move it here and re-pin the callers.
  # ♻️ The CaChereCyCle commit whose store (icons and favicons, Base64 in JSONL) guide_brand reads.
  CACHERECYCLE: "7e50f9f9f66026437254c4cc7b63bc2a697cceff"
  WEB_UI: "pysaiyanweboo @ git+https://github.com/myon-bioinformatics/PySaiyanWeBoo@1d697e7f157bc75c11a6d2711475a31fc421179c"

jobs:
  build:
    # A guide page is also built on pull requests, where an invalid spec fails. Everything else builds only when it deploys.
    if: inputs.guide_page != '' || (github.ref_name == github.event.repository.default_branch && (github.event_name == 'push' || inputs.build != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - if: inputs.guide_page != ''
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          enable-cache: false
      - if: inputs.guide_brand != '' && github.repository != 'myon-bioinformatics/CaChereCyCle'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/CaChereCyCle
          ref: ${{ env.CACHERECYCLE }}
          path: .cacherecycle
          persist-credentials: false
      - if: inputs.guide_page != ''
        name: Build the guide
        env:
          GUIDE_PAGE: ${{ inputs.guide_page }}
          GUIDE_ASSETS: ${{ inputs.guide_assets }}
          GUIDE_BRAND: ${{ inputs.guide_brand }}
          GUIDE_FEATURES: ${{ inputs.guide_features }}
          GUIDE_DIR: ${{ inputs.guide_dir }}
          ARTIFACT_PATH: ${{ inputs.artifact_path }}
          GUIDE_REPOSITORY: ${{ github.repository }}
        run: |
          # 📘 guide_dir keeps a Pages' own front page: the guide and everything next to it go one folder down.
          case "$GUIDE_DIR" in
            /* | *..*) echo "::error::guide_dir is a folder inside artifact_path" >&2; exit 1 ;;
          esac
          site="$ARTIFACT_PATH${GUIDE_DIR:+/$GUIDE_DIR}"
          mkdir -p "$site"
          read -r -a pairs <<< "$GUIDE_ASSETS"
          for pair in "${pairs[@]}"; do
            target="$site/${pair#*=}"
            mkdir -p "$(dirname "$target")"
            cp -R "${pair%%=*}" "$target"
          done
          if [ -n "$GUIDE_BRAND" ]; then
            # ♻️ The icon and favicon from the store; sizes are made there (averaged when shrinking) and kept as they are.
            store_cli=.cacherecycle/cacherecycle.py
            if [ "$GUIDE_REPOSITORY" = "myon-bioinformatics/CaChereCyCle" ]; then
              store_cli=cacherecycle.py
            fi
            python3 -S "$store_cli" sync "icon.png=$GUIDE_BRAND.icon" "favicon.png=$GUIDE_BRAND.favicon" \
              "icon-180.png=$GUIDE_BRAND.icon@180:opaque" "icon-192.png=$GUIDE_BRAND.icon@192:opaque" \
              "icon-512.png=$GUIDE_BRAND.icon@512:opaque" --cache "$site"
            rm -f "$site/.cacherecycle.json"
          fi
          # 📲 A guide with an icon also gets square icon-180/192/512.png, manifest.webmanifest and the spec with its
          # Base64 cache (home) next to the page, so "Add to Home Screen" and shortcuts show the repository's own icon.
          cp "$GUIDE_PAGE" "$site/guide.page.json"
          home=()
          if python3 -c 'import json, sys; sys.exit(0 if "icon" in json.load(open(sys.argv[1], encoding="utf-8")) else 1)' "$GUIDE_PAGE"; then
            home=(--home-screen "$site")
          fi
          # 📚 A 機能全一覧 tab lists every CLI command and public name, read from the code (add_features).
          features=()
          if [ "$GUIDE_FEATURES" != "-" ]; then
            read -r -a modules <<< "$GUIDE_FEATURES"
            if [ "${#modules[@]}" -eq 0 ]; then
              # 🔍 <name>.py (lower case, - as _), then the initials (search_seq_including_spaces → ssis.py, CaChereCyCle → cccc.py)
              read -r -a guesses <<< "$(python3 -c 'import re, sys; n = sys.argv[1]; w = re.findall(r"[A-Z]?[a-z0-9]+|[A-Z]+(?![a-z])", n)
          print(n.lower().replace("-", "_") + ".py", "".join(x[0] for x in w).lower() + ".py")' "${GUIDE_REPOSITORY#*/}")"
              for guess in "${guesses[@]}"; do
                if [ -f "$guess" ]; then
                  modules=("$guess")
                  break
                fi
              done
            fi
            for module in "${modules[@]}"; do
              features+=(--features "$module")
            done
          fi
          # 🤖 A 🔬 検証ガイド (runbook block) whose steps say "run": true: they run here, in the checkout, and the guide shows what came out.
          run=()
          if grep -Eq '"run": *true' "$GUIDE_PAGE"; then
            run=(--run-steps)
          fi
          # 🏠 portfolio · 🐙 repository: the way back comes from the pinned renderer (back_nav_html).
          uv run --no-project --with "$WEB_UI" python -m pysaiyanweboo --page "$site/guide.page.json" "${home[@]}" "${features[@]}" "${run[@]}" \
            --repository "$GUIDE_REPOSITORY" > "$site/index.html"
          grep -qF 'data-ui-back' "$site/index.html"
      - if: inputs.build != ''
        name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: ${{ inputs.build }}
      - if: github.ref_name == github.event.repository.default_branch
        name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ inputs.artifact_path }}

  deploy:
    needs: build
    # A push to the caller's default branch, or a scheduled / manual run on it (the build step regenerates the site).
    if: github.ref_name == github.event.repository.default_branch && (github.event_name == 'push' || inputs.build != '')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
