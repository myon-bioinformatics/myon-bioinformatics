name: Reusable static Pages deploy

on:
  workflow_call:
    inputs:
      artifact_path:
        description: "Explicit directory to upload to GitHub Pages"
        required: true
        type: string
      build:
        description: "Optional shell command that produces artifact_path (runs after checkout; the runner's python3 and GITHUB_TOKEN as GH_TOKEN are available)"
        required: false
        type: string
        default: ""
      guide_page:
        description: "Optional web-ui-page/1 spec (data only). It is rendered to artifact_path/index.html with the PySaiyanWeBoo pinned here, and pull requests build it without deploying"
        required: false
        type: string
        default: ""
      guide_assets:
        description: "Optional files or folders copied next to the guide, as space-separated SOURCE=NAME pairs (for example docs/brand/icon.png=icon.png docs/demos=demos)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # One group per ref: a pull request build never cancels a deployment from the default branch.
  group: "pages-${{ github.repository }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  # The one pin for every guide page; move it here and re-pin the callers.
  WEB_UI: "pysaiyanweboo @ git+https://github.com/myon-bioinformatics/PySaiyanWeBoo@3403f2fbf65f633bc1018ddf67d817a0f8e4905c"

jobs:
  build:
    # A guide page is also built on pull requests, where an invalid spec fails. Everything else builds only when it deploys.
    if: inputs.guide_page != '' || (github.ref_name == github.event.repository.default_branch && (github.event_name == 'push' || inputs.build != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - if: inputs.guide_page != ''
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          enable-cache: false
      - if: inputs.guide_page != ''
        name: Checkout the guide back-link helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .reusable-pages-static
          persist-credentials: false
          sparse-checkout: scripts/add_guide_backlinks.py
          sparse-checkout-cone-mode: false
      - if: inputs.guide_page != ''
        name: Record the helper checkout identity
        env:
          JOB_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          printf 'job.workflow_repository=%s\n' "$JOB_WORKFLOW_REPOSITORY"
          printf 'job.workflow_sha=%s\n' "$JOB_WORKFLOW_SHA"
          printf 'github.repository=%s\n' "$CALLER_REPOSITORY"
          printf 'github.workflow_sha=%s\n' "$CALLER_WORKFLOW_SHA"
      - if: inputs.guide_page != ''
        name: Build the guide
        env:
          GUIDE_PAGE: ${{ inputs.guide_page }}
          GUIDE_ASSETS: ${{ inputs.guide_assets }}
          ARTIFACT_PATH: ${{ inputs.artifact_path }}
          GUIDE_REPOSITORY: ${{ github.repository }}
          GUIDE_NAV_SCRIPT: ${{ github.workspace }}/.reusable-pages-static/scripts/add_guide_backlinks.py
        run: |
          mkdir -p "$ARTIFACT_PATH"
          uv run --no-project --with "$WEB_UI" python -m pysaiyanweboo --page "$GUIDE_PAGE" > "$ARTIFACT_PATH/index.html"
          python3 -S "$GUIDE_NAV_SCRIPT" --repository "$GUIDE_REPOSITORY" --in-place "$ARTIFACT_PATH/index.html"
          python3 -S "$GUIDE_NAV_SCRIPT" --repository "$GUIDE_REPOSITORY" --check "$ARTIFACT_PATH/index.html"
          read -r -a pairs <<< "$GUIDE_ASSETS"
          for pair in "${pairs[@]}"; do
            target="$ARTIFACT_PATH/${pair#*=}"
            mkdir -p "$(dirname "$target")"
            cp -R "${pair%%=*}" "$target"
          done
      - if: inputs.build != ''
        name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: ${{ inputs.build }}
      - if: github.ref_name == github.event.repository.default_branch
        name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ inputs.artifact_path }}

  deploy:
    needs: build
    # A push to the caller's default branch, or a scheduled / manual run on it (the build step regenerates the site).
    if: github.ref_name == github.event.repository.default_branch && (github.event_name == 'push' || inputs.build != '')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
