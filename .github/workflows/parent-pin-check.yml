name: Parent pin check

on:
  pull_request:
    paths:
      - "tools/parent_pin_check.py"
      - "tests/test_parent_pin_check.py"
      - ".github/workflows/reusable-parent-pin-check.yml"
      - ".github/workflows/parent-pin-check.yml"
      - "templates/**"
      - ".github/workflows/**"
      - "docs/**"
  push:
    branches: [main]
    paths:
      - "tools/parent_pin_check.py"
      - "tests/test_parent_pin_check.py"
      - ".github/workflows/reusable-parent-pin-check.yml"
      - ".github/workflows/parent-pin-check.yml"
      - "templates/**"
      - ".github/workflows/**"
      - "docs/**"

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/reusable-parent-pin-check.yml
    with:
      exclude-globs: |
        templates/parent-pr.ref.json
        tests/**

  reusable-layout-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: consumer
          persist-credentials: false
      - name: Checkout parent pin tool from public main (child-style path)
        uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: main
          path: parent-pin-tool
          sparse-checkout: |
            tools/parent_pin_check.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run tool fetched from parent main against consumer checkout
        run: |
          set -euo pipefail
          python parent-pin-tool/tools/parent_pin_check.py \
            --root consumer \
            --skip-api \
            --exclude 'tests/**' \
            --exclude 'templates/parent-pr.ref.json' \
            --event pull_request \
            --ref refs/pull/85/merge
