name: Parent pin check

on:
  pull_request:
    paths:
      - "tools/parent_pin_check.py"
      - "tests/test_parent_pin_check.py"
      - ".github/workflows/reusable-parent-pin-check.yml"
      - ".github/workflows/parent-pin-check.yml"
      - "templates/**"
      - ".github/workflows/**"
      - "docs/**"
  push:
    branches: [main]
    paths:
      - "tools/parent_pin_check.py"
      - "tests/test_parent_pin_check.py"
      - ".github/workflows/reusable-parent-pin-check.yml"
      - ".github/workflows/parent-pin-check.yml"
      - "templates/**"
      - ".github/workflows/**"
      - "docs/**"

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/reusable-parent-pin-check.yml
    with:
      exclude-globs: |
        tests/**
        .github/workflows/vendor-consumers-compat.yml
        docs/evidence/vendor-triage-20261019.json

  reusable-layout-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: consumer
          persist-credentials: false
      - name: Fetch parent pin tool from public main (fixed path)
        env:
          PARENT_REPOSITORY: myon-bioinformatics/myon-bioinformatics
          TOOL_PATH: tools/parent_pin_check.py
        run: |
          set -euo pipefail
          mkdir -p parent-pin-tool/tools
          url="https://raw.githubusercontent.com/${PARENT_REPOSITORY}/main/${TOOL_PATH}"
          if curl -fsSL "$url" -o "parent-pin-tool/${TOOL_PATH}"; then
            echo "Fetched parent pin tool from ${url}"
          elif [[ -f "consumer/${TOOL_PATH}" ]]; then
            echo "::warning::Parent pin tool not on main yet; bootstrapping from this checkout for parent CI only."
            cp "consumer/${TOOL_PATH}" "parent-pin-tool/${TOOL_PATH}"
          else
            echo "::error::Parent pin tool not found at ${url}" >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: false
      - name: Run tool fetched from parent main against consumer checkout
        run: |
          set -euo pipefail
          python parent-pin-tool/tools/parent_pin_check.py \
            --root consumer \
            --skip-api \
            --exclude 'tests/**' \
            --event pull_request \
            --ref refs/pull/85/merge
