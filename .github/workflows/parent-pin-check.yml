name: Parent pin check

on:
  pull_request:
    paths:
      - "tools/parent_pin_check.py"
      - "tests/test_parent_pin_check.py"
      - ".github/workflows/reusable-parent-pin-check.yml"
      - ".github/workflows/parent-pin-check.yml"
      - "templates/**"
      - ".github/workflows/**"
      - "docs/**"
  push:
    branches: [main]
    paths:
      - "tools/parent_pin_check.py"
      - "tests/test_parent_pin_check.py"
      - ".github/workflows/reusable-parent-pin-check.yml"
      - ".github/workflows/parent-pin-check.yml"
      - "templates/**"
      - ".github/workflows/**"
      - "docs/**"

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/reusable-parent-pin-check.yml
    with:
      exclude-globs: |
        templates/parent-pr.ref.json
        tests/**

  reusable-layout-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: consumer
          persist-credentials: false
      - name: Simulate child repo calling parent tool from separate checkout
        run: |
          set -euo pipefail
          mkdir -p parent-pin-tool/tools
          cp consumer/tools/parent_pin_check.py parent-pin-tool/tools/
          cp consumer/tools/__init__.py parent-pin-tool/tools/ 2>/dev/null || true
          python parent-pin-tool/tools/parent_pin_check.py \
            --root consumer \
            --skip-api \
            --exclude 'tests/**' \
            --exclude 'templates/parent-pr.ref.json' \
            --event pull_request \
            --ref refs/pull/85/merge
