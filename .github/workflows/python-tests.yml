name: Python tests

on:
  pull_request:
    paths:
      - "**.py"
      - "tests/**"
      - "vendor.lock.json"
      - "vendor/**"
      - ".github/workflows/python-tests.yml"
      - ".github/workflows/reusable-actionlint.yml"
  push:
    branches: [main]
    paths:
      - "**.py"
      - "tests/**"
      - "vendor.lock.json"
      - "vendor/**"
      - ".github/workflows/python-tests.yml"
      - ".github/workflows/reusable-actionlint.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m py_compile git_inspector.py gh_ops.py
      - name: Verify enrolled GitHub identity dependency (offline)
        run: python -S vendor_sync.py check --manifest vendor.lock.json
      - name: Run tests with JUnit
        run: python -m pytest -q --junitxml=reports/junit.xml
      - name: Preserve JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-parent-py${{ matrix.python }}
          path: reports/
          if-no-files-found: error
          retention-days: 14

  vendor-portability:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Exercise changed public Git snapshots and rejection cases
        run: python -m pytest -q tests/test_vendor_sync.py tests/test_vendor_stage.py tests/test_vendor_update_workflow.py tests/test_gh_ops.py --junitxml=reports/vendor.xml
      - name: Preserve vendor regression JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-vendor-${{ matrix.os }}-py${{ matrix.python }}
          path: reports/vendor.xml
          if-no-files-found: error
          retention-days: 14

  failure-identity:
    needs: [pytest, vendor-portability]
    if: always()
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-junit-identity.yml
    with:
      expected-reports: '["junit-parent-py3.10/junit.xml","junit-parent-py3.11/junit.xml","junit-parent-py3.12/junit.xml","junit-parent-py3.13/junit.xml","junit-parent-py3.14/junit.xml","junit-vendor-ubuntu-latest-py3.9/vendor.xml","junit-vendor-windows-latest-py3.12/vendor.xml","junit-vendor-macos-latest-py3.12/vendor.xml"]'
      output-artifact: parent-python-failure-identity
