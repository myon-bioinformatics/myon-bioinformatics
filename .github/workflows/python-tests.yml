name: Python tests

on:
  pull_request:
    paths:
      - "**.py"
      - "tests/**"
      - "vendor.lock.json"
      - "vendor-catalog.json"
      - "vendor-consumers.json"
      - "vendor/**"
      - ".github/workflows/python-tests.yml"
      - ".github/workflows/reusable-actionlint.yml"
      - ".github/workflows/vendor-parent-child-ci.yml"
      - "templates/vendor-child-ci.workflow.yml"
      - "child-heads.json"
      - "tools/parent_pin_check.py"
      - "tests/test_parent_pin_check.py"
      - ".github/workflows/reusable-parent-pin-check.yml"
      - ".github/workflows/parent-pin-check.yml"
      - "pytest.ini"
      - "pyproject.toml"
      - "uv.lock"
      - "pilot/**"
      - "docs/uv-git-source-migration.md"
      - "docs/python-ci-policy.md"
      - ".github/workflows/uv-git-sources.yml"
      - "py_launch.cjs"
      - "node_launch.py"
      - "tests/test_node_launch_catalog.py"
      - "tests/fixtures/node-launch-catalog-pin.lock.json"
  push:
    branches: [main]
    paths:
      - "**.py"
      - "tests/**"
      - "vendor.lock.json"
      - "vendor-catalog.json"
      - "vendor-consumers.json"
      - "vendor/**"
      - ".github/workflows/python-tests.yml"
      - ".github/workflows/reusable-actionlint.yml"
      - ".github/workflows/vendor-parent-child-ci.yml"
      - "templates/vendor-child-ci.workflow.yml"
      - "child-heads.json"
      - "tools/parent_pin_check.py"
      - "tests/test_parent_pin_check.py"
      - ".github/workflows/reusable-parent-pin-check.yml"
      - ".github/workflows/parent-pin-check.yml"
      - "pytest.ini"
      - "pyproject.toml"
      - "uv.lock"
      - "pilot/**"
      - "docs/uv-git-source-migration.md"
      - "docs/python-ci-policy.md"
      - ".github/workflows/uv-git-sources.yml"
      - "py_launch.cjs"
      - "node_launch.py"
      - "tests/test_node_launch_catalog.py"
      - "tests/fixtures/node-launch-catalog-pin.lock.json"
  schedule:
    - cron: "0 14 * * 1"

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  stdlib-runtime:
    name: Stdlib runtime (Python ${{ matrix.python }})
    # setup-python has no Python 3.9 distribution for Ubuntu 26.04.
    # Keep the legacy stdlib lane separate from the Python 3.11+ pytest jobs.
    runs-on: ${{ matrix.python == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Exercise runtime without third-party packages
        run: python -S tests/stdlib_runtime_smoke.py

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          cache-python: true
      - run: python -m py_compile git_inspector.py gh_ops.py vendor_consumers.py tools/parent_pin_check.py tools/minpy.py
      - name: Verify enrolled GitHub identity dependency (offline)
        run: python -S vendor_sync.py check --manifest vendor.lock.json
      - name: Regenerate minpy fixture and compare
        shell: bash
        run: |
          python tools/minpy.py bundle \
            --root tests/fixtures/minpy_widget \
            --entry app.py \
            --repository example/widget \
            --commit aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --skip-head-check \
            --output "$RUNNER_TEMP/app_min.py"
          python tools/minpy.py check \
            --bundle "$RUNNER_TEMP/app_min.py" \
            --root tests/fixtures/minpy_widget \
            --skip-head-check
      # The audit remains optional at runtime; this explicit stdlib test step
      # makes the parser/limits/privacy/unknown contracts visible in CI logs.
      - name: Verify executable audit contracts with Python -S
        if: matrix.python == '3.11'
        run: python -S -m unittest discover -s tests -p 'test_constrained_lab_exec_audit.py' -v
      # Run once per workflow to fail explicitly on stale or missing uv.lock.
      - name: Verify committed uv.lock matches pyproject.toml
        if: matrix.python == '3.11'
        run: uv lock --check
      - name: Run tests with JUnit
        run: uv run pytest -q --junitxml=reports/junit.xml
      # A transient Actions artifact-service DNS error must not discard
      # otherwise successful tests. A second failure remains a red check.
      - name: Preserve JUnit report
        id: parent_junit_upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: junit-parent-py${{ matrix.python }}
          path: reports/
          if-no-files-found: error
          retention-days: 14
      - name: Retry transient JUnit upload failure
        id: parent_junit_retry
        if: always() && steps.parent_junit_upload.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: junit-parent-py${{ matrix.python }}
          path: reports/
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Require JUnit upload success
        if: always() && steps.parent_junit_upload.outcome == 'failure' && steps.parent_junit_retry.outcome != 'success'
        run: exit 1

  py-launch-catalog-network:
    name: py_launch catalog pin (network)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          cache-python: true
      - name: Verify py_launch vendor-catalog pin against GitHub
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          attempts=3
          delay=20
          for attempt in $(seq 1 "$attempts"); do
            if uv run pytest -q -m network tests/test_py_launch_catalog.py; then
              echo "network catalog verification succeeded on attempt ${attempt}"
              exit 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "attempt ${attempt} failed; retrying in ${delay}s..."
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done
          echo "network catalog verification failed after ${attempts} attempts"
          exit 1

  node-launch-catalog-network:
    name: node_launch catalog pin (network)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          cache-python: true
      - name: Verify node_launch vendor-catalog pin against GitHub
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          attempts=3
          delay=20
          for attempt in $(seq 1 "$attempts"); do
            if uv run pytest -q -m network tests/test_node_launch_catalog.py; then
              echo "network catalog verification succeeded on attempt ${attempt}"
              exit 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "attempt ${attempt} failed; retrying in ${delay}s..."
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done
          echo "network catalog verification failed after ${attempts} attempts"
          exit 1

  vendor-portability:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          cache-python: true
      - name: Regenerate minpy fixture and compare
        shell: bash
        run: |
          python tools/minpy.py bundle \
            --root tests/fixtures/minpy_widget \
            --entry app.py \
            --repository example/widget \
            --commit aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --skip-head-check \
            --output "$RUNNER_TEMP/app_min.py"
          python tools/minpy.py check \
            --bundle "$RUNNER_TEMP/app_min.py" \
            --root tests/fixtures/minpy_widget \
            --skip-head-check
      - name: Exercise changed public Git snapshots and rejection cases
        run: uv run pytest -q tests/test_vendor_sync.py tests/test_vendor_stage.py tests/test_vendor_consumers.py tests/test_vendor_update_workflow.py tests/test_gh_ops.py tests/test_gh_ops_fetch_guard.py tests/test_minpy.py --junitxml=reports/vendor.xml
      - name: Preserve vendor regression JUnit
        id: vendor_junit_upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: junit-vendor-${{ matrix.os }}-py${{ matrix.python }}
          path: reports/vendor.xml
          if-no-files-found: error
          retention-days: 14
      - name: Retry transient vendor JUnit upload failure
        id: vendor_junit_retry
        if: always() && steps.vendor_junit_upload.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: junit-vendor-${{ matrix.os }}-py${{ matrix.python }}
          path: reports/vendor.xml
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Require vendor JUnit upload success
        if: always() && steps.vendor_junit_upload.outcome == 'failure' && steps.vendor_junit_retry.outcome != 'success'
        run: exit 1

  failure-identity:
    needs: [pytest, vendor-portability]
    if: always()
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-junit-identity.yml
    with:
      expected-reports: '["junit-parent-py3.11/junit.xml","junit-parent-py3.12/junit.xml","junit-parent-py3.13/junit.xml","junit-parent-py3.14/junit.xml","junit-vendor-ubuntu-latest-py3.11/vendor.xml","junit-vendor-windows-latest-py3.12/vendor.xml","junit-vendor-macos-latest-py3.12/vendor.xml"]'
      output-artifact: parent-python-failure-identity
      commit-sha: ${{ github.sha }}
