name: uv git sources

on:
  pull_request:
    paths:
      - "pilot/**"
      - "vendor-catalog.json"
      - "package.json"
      - "docs/uv-git-source-migration.md"
      - "docs/python-ci-policy.md"
      - ".github/workflows/uv-git-sources.yml"
  push:
    branches: [main]
    paths:
      - "pilot/**"
      - "vendor-catalog.json"
      - "package.json"
      - "docs/uv-git-source-migration.md"
      - "docs/python-ci-policy.md"
      - ".github/workflows/uv-git-sources.yml"

permissions:
  contents: read

jobs:
  dispatch:
    name: catalog git dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: false
      - name: Skip uv on python -S
        run: python -S pilot/vendor_dispatch.py --dry-run --offline
      - name: Skip uv on Python 3.9
        run: python pilot/vendor_dispatch.py --assume-python 3.9 --dry-run --offline
      - name: Resolve main and record commits into the catalog workspace
        run: python pilot/vendor_dispatch.py --resolve-ref main --record
