name: Reusable parent pin check

on:
  workflow_call:
    inputs:
      parent-repository:
        description: "Parent OWNER/REPO whose commit pins must be unified"
        type: string
        default: "myon-bioinformatics/myon-bioinformatics"
      root:
        description: "Checkout-relative root to scan in the caller repository"
        type: string
        default: "."
      exclude-globs:
        description: "Newline-separated extra fnmatch globs to skip"
        type: string
        default: ""
      skip-default-excludes:
        description: "Scan fleet observation files such as child-heads.json"
        type: boolean
        default: false
      fleet:
        description: "Audit all public child default branches (parent CI only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  parent-pin-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: consumer
          persist-credentials: false
      - name: Fetch parent pin tool from public main (fixed path)
        env:
          PARENT_REPOSITORY: ${{ inputs.parent-repository }}
          TOOL_PATH: tools/parent_pin_check.py
        run: |
          set -euo pipefail
          mkdir -p parent-pin-tool/tools
          url="https://raw.githubusercontent.com/${PARENT_REPOSITORY}/main/${TOOL_PATH}"
          if curl -fsSL "$url" -o "parent-pin-tool/${TOOL_PATH}"; then
            echo "Fetched parent pin tool from ${url}"
          elif [[ "${{ github.repository }}" == "${PARENT_REPOSITORY}" ]] \
            && [[ -f "consumer/${TOOL_PATH}" ]]; then
            echo "::warning::Parent pin tool not on main yet; bootstrapping from this checkout for parent CI only."
            cp "consumer/${TOOL_PATH}" "parent-pin-tool/${TOOL_PATH}"
          else
            echo "::error::Parent pin tool not found at ${url}" >&2
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify parent repository pin consistency
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PARENT_REPOSITORY: ${{ inputs.parent-repository }}
          CHECK_ROOT: ${{ inputs.root }}
          EXCLUDE_GLOBS: ${{ inputs.exclude-globs }}
          SKIP_DEFAULT_EXCLUDES: ${{ inputs.skip-default-excludes }}
          RUN_FLEET: ${{ inputs.fleet }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          args=(--parent "$PARENT_REPOSITORY" --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF")
          if [[ "$RUN_FLEET" == "true" ]]; then
            args+=(--fleet)
          else
            args+=(--root "consumer/${CHECK_ROOT}")
          fi
          if [[ "$SKIP_DEFAULT_EXCLUDES" == "true" ]]; then
            args+=(--no-default-excludes)
          fi
          if [[ -n "$EXCLUDE_GLOBS" ]]; then
            while IFS= read -r pattern; do
              [[ -z "$pattern" ]] && continue
              args+=(--exclude "$pattern")
            done <<< "$EXCLUDE_GLOBS"
          fi
          python parent-pin-tool/tools/parent_pin_check.py "${args[@]}"
